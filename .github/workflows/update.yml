name: update-feeds

# Pipeline: fetch USOM API → write domains.txt, domains_critical.txt, ips.txt, index.html → sync to R2

on:
  schedule:
    # iki kez: GitHub Actions schedule best-effort, biri kaçırılsa diğeri yakalar
    - cron: "13,43 * * * *"
  workflow_dispatch:

concurrency:
  group: update-feeds
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write  # keepalive commit için (aşağıda) — 60-gün schedule disable koruması
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: build feeds
        run: python scripts/build.py

      - name: verify outputs exist and are non-trivial
        run: |
          test -s out/domains.txt
          test -s out/ips.txt
          wc -l out/domains.txt out/ips.txt

      - name: sync to R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: https://${{ secrets.R2_ACCOUNT_ID }}.r2.cloudflarestorage.com
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          # txt dosyaları → text/plain
          aws s3 sync ./out/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.txt" --delete \
            --content-type "text/plain; charset=utf-8" \
            --cache-control "public, max-age=3600"
          # index.html → text/html
          aws s3 sync ./out/ "s3://${R2_BUCKET}/" \
            --endpoint-url "$R2_ENDPOINT" \
            --exclude "*" --include "*.html" --delete \
            --content-type "text/html; charset=utf-8" \
            --cache-control "public, max-age=3600"

      - name: keepalive commit
        # 60 günde bir push activity yoksa GitHub schedule cron'u devre dışı bırakır.
        # Her koşuda status dosyasını güncelleyip commit atarak sayacı sıfır tutuyoruz.
        run: |
          mkdir -p .github
          {
            echo "{"
            echo "  \"last_run\": \"$(date -u +%Y-%m-%dT%H:%M:%SZ)\","
            echo "  \"domains\": $(wc -l < out/domains.txt),"
            echo "  \"domains_critical\": $(wc -l < out/domains_critical.txt),"
            echo "  \"ips\": $(wc -l < out/ips.txt),"
            echo "  \"ips_global\": $(wc -l < out/ips_global.txt)"
            echo "}"
          } > .github/last_run.json
          git config user.name "usomfeed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add .github/last_run.json
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)"
          git pull --rebase --autostash origin main
          git push
